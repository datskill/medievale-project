<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Chope d'Étain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --fond:#b7b0a4; --titre:#2a1b10; --texte:#3a2a1c;
  --ardoise:#2c3335; --craie:#ece8dc; --craie-pale:rgba(236,232,220,.55);
  --chene:#5a3b22; --suif:#e8c66a; --vin:#8a2e3c;
  --parchemin:#e2d3b0; --encre:#2a1b10;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --fond:#15110e; --titre:#e8c66a; --texte:#cbbfa8; }
}
:root[data-theme="dark"]{ --fond:#15110e; --titre:#e8c66a; --texte:#cbbfa8; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font-family:"IM Fell English",Georgia,"Times New Roman",serif;font-size:16px;line-height:1.45}
.cadre{max-width:1260px;margin:0 auto;padding:14px 16px 24px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.titre{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.titre h1{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:2.1rem;margin:0;color:var(--titre);letter-spacing:.02em}
.titre p{margin:0;font-style:italic}
.scene{position:relative;border:7px solid #2a1b10;border-radius:3px;box-shadow:0 0 0 2px #6b4a2e,0 10px 30px rgba(0,0,0,.35);background:#000}
canvas{display:block;width:100%;height:auto}
.aide{margin:8px 2px 0;font-size:.95rem}
.aide kbd{font-family:inherit;border:1px solid currentColor;border-radius:3px;padding:0 5px;font-size:.85rem}
.ardoise{background:var(--ardoise);color:var(--craie);border:11px solid var(--chene);border-radius:5px;padding:14px 18px 18px;box-shadow:inset 0 0 50px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.3);text-shadow:0 0 1px rgba(255,255,255,.25)}
.ardoise h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.6rem;margin:0}
.ardoise h3{font-weight:400;font-style:italic;font-size:1.1rem;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px dashed var(--craie-pale)}
.moment{margin:0 0 10px;color:var(--craie-pale)}
.bourse{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.bourse span{display:block;font-size:.85rem;color:var(--craie-pale)}
.bourse strong{font-weight:400;font-size:1.25rem}
.jauge{height:6px;background:rgba(255,255,255,.14);border-radius:3px;margin-top:4px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--suif)}
.dette{margin:0 0 10px;padding:6px 8px;border-left:3px solid var(--vin);background:rgba(138,46,60,.18);font-size:.92rem}
ul,ol{list-style:none;margin:0;padding:0}
.plats li{display:grid;grid-template-columns:1fr auto;padding:3px 0}
.plats .qte{font-size:1.15rem;color:var(--suif)}
.plats small{grid-column:1/-1;color:var(--craie-pale);font-size:.82rem}
.reserve{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.reserve li{display:flex;justify-content:space-between;padding:1px 0}
table.marche{width:100%;border-collapse:collapse}
.marche td{padding:3px 0}
.marche td.prix{text-align:right;padding-right:8px;color:var(--craie-pale);white-space:nowrap}
.marche td.btns{text-align:right;white-space:nowrap}
button{font-family:inherit;font-size:.95rem;color:var(--craie);background:transparent;border:1.5px solid var(--craie-pale);border-radius:3px;padding:2px 9px;cursor:pointer}
button:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:var(--craie)}
button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--suif);outline-offset:2px}
button.principal{display:block;width:100%;background:var(--suif);color:#2a1b10;border-color:var(--suif);font-size:1.15rem;padding:9px;margin-top:4px;text-shadow:none}
button.principal:hover{background:#f2d684}
.secondaire{margin-top:8px;width:100%}
.carnet li{font-size:.9rem;padding:2px 0;border-bottom:1px dotted rgba(236,232,220,.15)}
.carnet li:first-child{color:var(--craie)}
.carnet li:not(:first-child){color:var(--craie-pale)}
.pied{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--craie-pale)}
.pied button{font-size:.8rem}
.air{margin:14px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;font-style:italic;color:var(--craie-pale)}
.air button{font-size:.8rem;font-style:normal;white-space:nowrap}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,10,6,.7);padding:16px}
#overlay.visible{display:flex}
.carte{background:var(--parchemin);color:var(--encre);max-width:440px;width:100%;padding:22px 26px;border-radius:2px;box-shadow:0 0 0 3px #6b4a2e,0 20px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.carte h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:1.8rem;margin:0 0 8px}
.carte p{margin:0 0 10px}
.carte dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0 0 14px}
.carte dt{font-weight:400}
.carte dd{margin:0;text-align:right}
.carte button{color:var(--encre);border-color:var(--encre);font-size:1.05rem;padding:6px 14px}
.carte button.principal{color:#2a1b10}
.carte kbd{font-family:inherit;border:1px solid var(--encre);border-radius:3px;padding:0 5px}
.carte.tuto{max-width:540px}
.carte .chapitre{margin:0;font-style:italic;font-size:.9rem;opacity:.75}
.carte ul.points{list-style:disc;padding-left:20px;margin:0 0 10px}
.carte ul.points li{margin-bottom:4px}
.carte ol.etapes{counter-reset:e;margin:4px 0 12px}
.carte ol.etapes li{counter-increment:e;position:relative;padding:4px 0 4px 34px;border-bottom:1px dotted rgba(42,27,16,.25)}
.carte ol.etapes li::before{content:counter(e);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--chene);color:var(--parchemin);text-align:center;line-height:24px;font-size:.9rem}
.carte .astuce{border-left:3px solid var(--chene);background:rgba(90,59,34,.1);padding:6px 10px;font-size:.95rem}
.carte .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.carte .nav .principal{width:auto;margin:0;padding:6px 16px}
.carte .points-pages{display:flex;gap:6px}
.carte .points-pages i{width:8px;height:8px;border-radius:50%;background:rgba(42,27,16,.25)}
.carte .points-pages i.actif{background:var(--encre)}
.carte .passer{border:none;text-decoration:underline;font-size:.9rem;padding:2px 0;opacity:.75}
.carte .boutons{display:flex;flex-direction:column;gap:8px}
@media (max-width:920px){.cadre{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cadre">
  <header class="titre">
    <h1>La Chope d'Étain</h1>
    <p>Une auberge de village à tenir, jour après jour.</p>
  </header>
  <div>
    <div class="scene">
      <canvas id="jeu" width="800" height="600" aria-label="Salle de la taverne"></canvas>
      <div id="overlay" role="dialog" aria-modal="true"></div>
    </div>
    <p class="aide"><kbd>Z Q S D</kbd> ou flèches : se déplacer. <kbd>E</kbd> : prendre un plat ou servir. <kbd>R</kbd> : préparer une fournée. <kbd>P</kbd> : pause. <kbd>T</kbd> : tutoriel. <kbd>M</kbd> : musique.</p>
  </div>
  <aside class="ardoise" id="ardoise" aria-live="polite"></aside>
</div>

<script>
'use strict';
/* =========================================================
   La Chope d'Étain, version 1
   Toutes les données du jeu sont dans DATA : pour ajouter un
   ingrédient, une recette ou un type de client, il suffit
   d'ajouter une entrée ici.
   ========================================================= */
const W = 800, H = 600, DUREE_SERVICE = 180, SAVE_KEY = 'taverne-chope-v1';

const DATA = {
  ingredients: {
    orge:    { nom: 'Orge',    prix: 4 },
    viande:  { nom: 'Viande',  prix: 6 },
    legumes: { nom: 'Légumes', prix: 1 },
    bois:    { nom: 'Bois',    prix: 1 },
    pain:    { nom: 'Pain',    prix: 2 },
    fromage: { nom: 'Fromage', prix: 3 },
  },
  recettes: {
    biere:   { nom: 'Bière', unite: 'chopes', article: 'une chope de bière', entrees: { orge: 3 }, rendement: 12, duree: 'nuit', prix: 3, perissable: false },
    ragout:  { nom: 'Ragoût', unite: 'bols', article: 'un bol de ragoût', entrees: { viande: 1, legumes: 2, bois: 1 }, rendement: 6, duree: 30, prix: 5, perissable: true },
    tartine: { nom: 'Pain et fromage', unite: 'assiettes', article: 'du pain et du fromage', entrees: { pain: 1, fromage: 1 }, rendement: 4, duree: 6, prix: 2, perissable: true },
  },
  clients: [
    { id: 'paysan',    titre: 'Le paysan',    poids: 6,   repMin: 0,  patience: 55, pourboire: 0.5, commandes: { biere: 5, tartine: 4, ragout: 2 }, habit: '#7a5a3a', tete: '#d9a87c', coiffe: '#4a3a28' },
    { id: 'marchand',  titre: 'Le marchand',  poids: 3,   repMin: 20, patience: 45, pourboire: 1.5, commandes: { biere: 3, ragout: 4, tartine: 1 }, habit: '#2f5d50', tete: '#e0b48e', coiffe: '#6b1f2a' },
    { id: 'chevalier', titre: 'Le chevalier', poids: 1.5, repMin: 40, patience: 38, pourboire: 3,   commandes: { ragout: 4, biere: 4 },             habit: '#8a9396', tete: '#d6a37a', coiffe: '#5d666a', casque: true },
  ],
  equipement: {
    tonneau2: { nom: 'Second tonneau', prix: 60 },
  },
};

const STATIONS = [
  { id: 'tonneau1', type: 'tonneau',  recette: 'biere',   x: 90 },
  { id: 'tonneau2', type: 'tonneau',  recette: 'biere',   x: 170, equip: 'tonneau2' },
  { id: 'chaudron', type: 'chaudron', recette: 'ragout',  x: 330 },
  { id: 'planche',  type: 'planche',  recette: 'tartine', x: 540 },
];
const TABLES = [{ x: 220, y: 290 }, { x: 460, y: 290 }, { x: 220, y: 440 }, { x: 460, y: 440 }];
const SIEGES = [];
TABLES.forEach(t => {
  SIEGES.push({ x: t.x - 50, y: t.y, cote: 1, occ: null });
  SIEGES.push({ x: t.x + 50, y: t.y, cote: -1, occ: null });
});
const DECOR = [{ x: 712, y: 500, w: 50, h: 70 }]; // tonneaux décoratifs (bloquants)
const ESTRADE = { x: 640, y: 282, w: 92, h: 46 }; // le coin du barde (bloquant)
const ALLEE_X = 340;

/* ---------- utilitaires ---------- */
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
function tirage(paires) {
  let tot = 0; for (const p of paires) tot += p[1];
  let r = Math.random() * tot;
  for (const p of paires) { r -= p[1]; if (r <= 0) return p[0]; }
  return paires[paires.length - 1][0];
}
function tirerPrix() {
  const p = {};
  for (const k in DATA.ingredients) p[k] = Math.max(1, Math.round(DATA.ingredients[k].prix * (0.8 + Math.random() * 0.4)));
  return p;
}
const typeClient = id => DATA.clients.find(t => t.id === id);
const stationsActives = () => STATIONS.filter(s => !s.equip || S.equip[s.equip]);

/* ---------- état et sauvegarde ---------- */
function nouvellePartie() {
  return {
    version: 1, jour: 1, deniers: 40, rep: 30, dette: 0, introVue: false, tutoVu: false, musique: true,
    stock: { orge: 3, viande: 1, legumes: 4, bois: 4, pain: 2, fromage: 2 },
    stations: {
      tonneau1: { portions: 12, enCours: false, reste: 0 },
      tonneau2: { portions: 0, enCours: false, reste: 0 },
      chaudron: { portions: 0, enCours: false, reste: 0 },
      planche:  { portions: 0, enCours: false, reste: 0 },
    },
    equip: { tonneau2: false },
    prix: tirerPrix(),
  };
}
function charger() {
  let s = nouvellePartie();
  try {
    const txt = localStorage.getItem(SAVE_KEY);
    if (txt) s = Object.assign(s, JSON.parse(txt));
  } catch (e) { /* pas de sauvegarde lisible : nouvelle partie */ }
  // compléter les champs ajoutés par de futures versions
  for (const k in DATA.ingredients) { if (s.stock[k] == null) s.stock[k] = 0; if (s.prix[k] == null) s.prix[k] = DATA.ingredients[k].prix; }
  for (const st of STATIONS) if (!s.stations[st.id]) s.stations[st.id] = { portions: 0, enCours: false, reste: 0 };
  for (const k in DATA.equipement) if (s.equip[k] == null) s.equip[k] = false;
  return s;
}
function sauver() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

let S = charger();
const P = { x: ALLEE_X, y: 220, mains: [], marche: 0, bouge: false };
const R = {
  phase: 'matin', horloge: 0, spawnT: 2, ferme: false, pause: false, overlay: null, page: 0, retour: null,
  clients: [], textes: [], journal: [], toast: null, uid: 0, confirmReset: 0,
  stats: null,
};
function resetStats() { R.stats = { recette: 0, servis: 0, partis: 0, rep0: S.rep, remb: 0 }; }
resetStats();

function message(txt) {
  R.journal.unshift(txt); R.journal.length = Math.min(R.journal.length, 7);
  R.toast = { txt, t: 3.2 };
}
function texte(x, y, txt, col) { R.textes.push({ x, y, txt, col, t: 1.3 }); }

/* ---------- clavier ---------- */
const touches = {};
const k = c => touches[c] ? 1 : 0;
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  touches[e.code] = true;
  if (e.repeat) return;
  if (R.overlay === 'tuto') {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') pageTuto(1);
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') pageTuto(-1);
    else if (e.code === 'Escape' || e.code === 'KeyT') fermerTuto();
    return;
  }
  if (e.code === 'KeyM') { basculerMusique(); return; }
  if (e.code === 'KeyT') ouvrirTuto();
  else if (e.code === 'KeyE') interagir();
  else if (e.code === 'KeyR') preparer();
  else if (e.code === 'KeyP' || e.code === 'Escape') basculerPause();
});
addEventListener('keyup', e => { touches[e.code] = false; });
addEventListener('blur', () => { for (const c in touches) touches[c] = false; });

/* ---------- collisions ---------- */
function bloque(x, y) {
  const r = 12;
  if (x < 30 + r || x > 770 - r || y < 138 || y > 568) return true;
  for (const t of TABLES) if (x > t.x - 32 - r && x < t.x + 32 + r && y > t.y - 22 - r && y < t.y + 22 + r) return true;
  for (const d of [...DECOR, ESTRADE]) if (x > d.x - r && x < d.x + d.w + r && y > d.y - r && y < d.y + d.h + r) return true;
  return false;
}

/* ---------- interactions ---------- */
function cible() {
  let best = null, bd = 1e9;
  for (const c of R.clients) {
    if (c.etat !== 'attend') continue;
    const d = Math.hypot(c.x - P.x, c.y - P.y);
    if (d < 66 && d < bd) { bd = d; best = { t: 'client', o: c }; }
  }
  for (const s of stationsActives()) {
    const d = Math.hypot(s.x - P.x, 140 - P.y);
    if (d < 58 && d < bd) { bd = d; best = { t: 'station', o: s }; }
  }
  return best;
}
function interagir() {
  if (R.overlay || R.phase === 'soir') return;
  const c = cible(); if (!c) return;
  if (c.t === 'client') {
    const cl = c.o, rec = DATA.recettes[cl.commande];
    const i = P.mains.indexOf(cl.commande);
    if (i < 0) { message(`${typeClient(cl.type).titre} attend ${rec.article}.`); return; }
    P.mains.splice(i, 1);
    servir(cl);
  } else {
    const s = c.o, st = S.stations[s.id], rec = DATA.recettes[s.recette];
    if (st.portions > 0) {
      if (P.mains.length >= 2) { message('Tes deux mains sont prises. Sers un client d\'abord.'); return; }
      st.portions--; P.mains.push(s.recette);
    } else if (st.enCours) {
      message(rec.duree === 'nuit' ? 'La bière fermente, elle sera prête demain matin.' : `${rec.nom} en cours, encore ${Math.ceil(st.reste)} s.`);
    } else {
      message(`Plus de ${rec.nom.toLowerCase()} ici. Appuie sur R pour préparer une fournée.`);
    }
  }
}
function preparer() {
  if (R.overlay || R.phase === 'soir') return;
  const c = cible(); if (!c || c.t !== 'station') return;
  const s = c.o, st = S.stations[s.id], rec = DATA.recettes[s.recette];
  if (st.enCours) { message('Une fournée est déjà en cours ici.'); return; }
  const manque = Object.entries(rec.entrees).filter(([i, n]) => S.stock[i] < n);
  if (manque.length) {
    message('Il manque ' + manque.map(([i, n]) => `${n - S.stock[i]} ${DATA.ingredients[i].nom.toLowerCase()}`).join(', ') + '. Le marché ouvre le matin.');
    return;
  }
  for (const [i, n] of Object.entries(rec.entrees)) S.stock[i] -= n;
  st.enCours = true; st.reste = rec.duree === 'nuit' ? 0 : rec.duree;
  message(rec.duree === 'nuit' ? 'Brassage lancé : la bière sera prête demain matin.' : `${rec.nom} lancé, prêt dans ${rec.duree} s.`);
  if (R.phase === 'matin') sauver();
}
function servir(cl) {
  const t = typeClient(cl.type), rec = DATA.recettes[cl.commande];
  const ratio = cl.patience / cl.patienceMax;
  const gain = rec.prix + Math.round(t.pourboire * ratio * 2);
  S.deniers += gain; R.stats.recette += gain; R.stats.servis++;
  S.rep = clamp(S.rep + (ratio > 0.5 ? 2 : 1));
  cl.etat = 'mange'; cl.mange = 6 + Math.random() * 4;
  texte(cl.x, cl.y - 44, `+${gain} d`, '#f0d36a');
}

/* ---------- clients ---------- */
function faireVenir() {
  const libres = SIEGES.filter(s => !s.occ); if (!libres.length) return;
  const t = tirage(DATA.clients.filter(c => S.rep >= c.repMin).map(c => [c, c.poids]));
  const siege = libres[Math.floor(Math.random() * libres.length)];
  const c = {
    id: ++R.uid, type: t.id, x: ALLEE_X, y: 615, siege, commande: tirage(Object.entries(t.commandes)),
    etat: 'arrive', patienceMax: t.patience, patience: t.patience, mange: 0, marche: 0, fache: false,
    chemin: [{ x: ALLEE_X, y: siege.y + 55 }, { x: siege.x, y: siege.y + 55 }, { x: siege.x, y: siege.y }],
  };
  siege.occ = c.id; R.clients.push(c);
}
function partir(c) {
  c.etat = 'part';
  c.chemin = [{ x: c.x, y: c.siege.y + 55 }, { x: ALLEE_X, y: c.siege.y + 55 }, { x: ALLEE_X, y: 618 }];
}

/* ---------- déroulé des journées ---------- */
function ouvrir() {
  if (R.phase !== 'matin') return;
  R.phase = 'service'; R.horloge = 0; R.spawnT = 2; R.ferme = false; resetStats();
  message('La taverne ouvre ses portes.');
}
function finJournee() {
  R.phase = 'soir';
  for (const r of P.mains) { const s = stationsActives().find(s => s.recette === r); if (s) S.stations[s.id].portions++; }
  P.mains = [];
  if (S.dette > 0) {
    const remb = Math.min(S.dette, Math.ceil(R.stats.recette * 0.25), S.deniers);
    S.dette -= remb; S.deniers -= remb; R.stats.remb = remb;
  }
  R.overlay = 'bilan';
  afficherOverlay();
}
function nuit() {
  const notes = [];
  for (const s of stationsActives()) {
    const st = S.stations[s.id], rec = DATA.recettes[s.recette];
    if (st.enCours) { st.enCours = false; st.portions += rec.rendement; if (rec.duree === 'nuit') notes.push('La bière brassée hier est prête'); }
    if (rec.perissable && st.portions > 0) {
      const perdu = Math.ceil(st.portions / 2); st.portions -= perdu;
      notes.push(`${perdu} ${rec.unite} de ${rec.nom.toLowerCase()} ont tourné pendant la nuit`);
    }
  }
  S.jour++; S.prix = tirerPrix();
  R.phase = 'matin'; R.horloge = 0; R.ferme = false; R.overlay = null; R.clients = [];
  SIEGES.forEach(s => s.occ = null);
  P.x = ALLEE_X; P.y = 220;
  sauver();
  afficherOverlay();
  message(`Jour ${S.jour}. ` + (notes.length ? notes.join('. ') + '.' : 'Le marché est ouvert.'));
}
function basculerPause() {
  if (R.overlay === 'intro' || R.overlay === 'bilan' || R.overlay === 'tuto') return;
  R.overlay = R.overlay === 'pause' ? null : 'pause';
  afficherOverlay();
}

/* ---------- mise à jour ---------- */
function maj(dt) {
  // tavernier
  let dx = (k('KeyD') || k('ArrowRight')) - (k('KeyA') || k('ArrowLeft'));
  let dy = (k('KeyS') || k('ArrowDown')) - (k('KeyW') || k('ArrowUp'));
  P.bouge = !!(dx || dy);
  if (P.bouge) {
    const l = Math.hypot(dx, dy), v = 175 * dt;
    const nx = P.x + dx / l * v, ny = P.y + dy / l * v;
    if (!bloque(nx, P.y)) P.x = nx;
    if (!bloque(P.x, ny)) P.y = ny;
    P.marche += dt * 12;
  }
  // fournées
  for (const s of stationsActives()) {
    const st = S.stations[s.id], rec = DATA.recettes[s.recette];
    if (st.enCours && rec.duree !== 'nuit') {
      st.reste -= dt;
      if (st.reste <= 0) { st.enCours = false; st.portions += rec.rendement; message(`${rec.nom} prêt : ${rec.rendement} ${rec.unite}.`); }
    }
  }
  // service
  if (R.phase === 'service') {
    R.horloge += dt;
    if (!R.ferme) {
      R.spawnT -= dt;
      if (R.spawnT <= 0 && R.horloge < DUREE_SERVICE - 15) {
        faireVenir();
        R.spawnT = Math.max(3, (16 - S.rep * 0.1) * (0.6 + Math.random() * 0.8));
      }
      if (R.horloge >= DUREE_SERVICE) {
        R.ferme = true;
        message('Minuit sonne, la taverne ferme.');
        for (const c of R.clients) if (c.etat === 'attend' || c.etat === 'arrive') partir(c);
      }
    } else if (!R.clients.length) finJournee();
  }
  // clients
  for (const c of R.clients) {
    if (c.chemin.length) {
      const p = c.chemin[0], ddx = p.x - c.x, ddy = p.y - c.y, d = Math.hypot(ddx, ddy), v = 78 * dt;
      if (d <= v) {
        c.x = p.x; c.y = p.y; c.chemin.shift();
        if (!c.chemin.length) { if (c.etat === 'arrive') c.etat = 'attend'; else if (c.etat === 'part') c.sortie = true; }
      } else { c.x += ddx / d * v; c.y += ddy / d * v; }
      c.marche += dt * 10;
    } else if (c.etat === 'attend') {
      c.patience -= dt;
      if (c.patience <= 0) {
        c.fache = true; S.rep = clamp(S.rep - 3); R.stats.partis++;
        message(`${typeClient(c.type).titre} est reparti sans être servi.`);
        partir(c);
      }
    } else if (c.etat === 'mange') {
      c.mange -= dt; if (c.mange <= 0) partir(c);
    }
  }
  R.clients = R.clients.filter(c => { if (c.sortie) { c.siege.occ = null; return false; } return true; });
  // textes
  for (const t of R.textes) { t.t -= dt; t.y -= 22 * dt; }
  R.textes = R.textes.filter(t => t.t > 0);
  if (R.toast) { R.toast.t -= dt; if (R.toast.t <= 0) R.toast = null; }
}

  let h = `<h2>Jour ${S.jour}</h2><p class="moment">${ph === 'matin' ? 'Le matin, le marché est ouvert.' : ph === 'service' ? (R.ferme ? 'Fermeture, les derniers clients s\'en vont.' : `Service en cours, ${heure()}`) : 'La nuit est tombée.'}</p>`;
  h += `<div class="bourse"><div><span>Bourse</span><strong>${S.deniers} deniers</strong></div><div><span>Réputation</span><strong>${Math.round(S.rep)} / 100</strong><div class="jauge"><i style="width:${S.rep}%"></i></div></div></div>`;
  if (S.dette > 0) h += `<p class="dette">Tu dois ${S.dette} deniers au seigneur. Un quart des recettes de chaque soir sert à le rembourser.</p>`;
  if (ph === 'matin') h += `<button class="principal" data-a="ouvrir">Ouvrir la taverne</button>`;
  h += '<h3>Plats prêts</h3><ul class="plats">';
  for (const [id, rec] of Object.entries(DATA.recettes)) {
    const ss = stationsActives().filter(s => s.recette === id);
    const tot = ss.reduce((n, s) => n + S.stations[s.id].portions, 0);
    const ent = Object.entries(rec.entrees).map(([i, n]) => `${n} ${DATA.ingredients[i].nom.toLowerCase()}`).join(', ');
    h += `<li><span>${rec.nom}</span><span class="qte">${tot}</span><small>${ent} donnent ${rec.rendement} ${rec.unite} en ${rec.duree === 'nuit' ? 'une nuit' : rec.duree + ' s'}. Vendu ${rec.prix} d${rec.perissable ? ', se garde mal' : ''}.</small></li>`;
  }
  h += '</ul><h3>Réserve</h3><ul class="reserve">';
  for (const [i, ing] of Object.entries(DATA.ingredients)) h += `<li><span>${ing.nom}</span><span>${S.stock[i]}</span></li>`;
  h += '</ul>';
  if (ph === 'matin') {
    h += '<h3>Marché du jour</h3><table class="marche"><tbody>';
    for (const [i, ing] of Object.entries(DATA.ingredients)) {
      const p = S.prix[i];
      h += `<tr><td>${ing.nom}</td><td class="prix">${p} d</td><td class="btns"><button data-a="acheter" data-k="${i}" data-n="1" ${S.deniers < p ? 'disabled' : ''}>+1</button> <button data-a="acheter" data-k="${i}" data-n="5" ${S.deniers < p * 5 ? 'disabled' : ''}>+5</button></td></tr>`;
    }
    h += '</tbody></table>';
    for (const [e, eq] of Object.entries(DATA.equipement)) if (!S.equip[e]) h += `<button class="secondaire" data-a="equip" data-k="${e}" ${S.deniers < eq.prix ? 'disabled' : ''}>Acheter un ${eq.nom.toLowerCase()} (${eq.prix} d)</button>`;
    if (S.deniers < 15 && S.dette < 100) h += `<button class="secondaire" data-a="pret">Demander 40 deniers au seigneur (50 à rendre)</button>`;
  }
  h += '<h3>Carnet</h3><ol class="carnet">' + (R.journal.length ? R.journal.map(j => `<li>${j}</li>`).join('') : '<li>Achète tes ingrédients, prépare tes plats, puis ouvre la taverne.</li>') + '</ol>';
  h += `<p class="air"><span>♪ ${S.musique === false ? 'Le ménestrel se tait' : Musique.nom(airDuJour())}</span><button data-a="musique">${S.musique === false ? 'Remettre la musique' : 'Couper la musique'}</button></p>`;
  h += `<div class="pied"><span>Sauvegarde chaque matin</span><button data-a="tuto">Tutoriel</button><button data-a="nouvelle">${Date.now() < R.confirmReset ? 'Confirmer : tout effacer' : 'Nouvelle partie'}</button></div>`;
  if (h !== dernierPanel) { panel.innerHTML = h; dernierPanel = h; }
}
panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  b.blur();
  const a = b.dataset.a;
  if (a === 'ouvrir') ouvrir();
  else if (a === 'tuto') ouvrirTuto();
  else if (a === 'musique') basculerMusique();
  else if (a === 'acheter' && R.phase === 'matin') {
    const i = b.dataset.k, n = +b.dataset.n, cout = S.prix[i] * n;
    if (S.deniers >= cout) { S.deniers -= cout; S.stock[i] += n; sauver(); }
  } else if (a === 'equip' && R.phase === 'matin') {
    const eq = DATA.equipement[b.dataset.k];
    if (S.deniers >= eq.prix) { S.deniers -= eq.prix; S.equip[b.dataset.k] = true; message(`${eq.nom} installé.`); sauver(); }
  } else if (a === 'pret') {
    S.deniers += 40; S.dette += 50; message('Le seigneur t\'avance 40 deniers.'); sauver();
  } else if (a === 'nouvelle') {
    if (Date.now() < R.confirmReset) {
      const musique = S.musique;
      S = nouvellePartie(); S.introVue = true; S.tutoVu = true; S.musique = musique; sauver();
      R.phase = 'matin'; R.clients = []; R.journal = []; R.overlay = null; P.mains = []; P.x = ALLEE_X; P.y = 220;
      SIEGES.forEach(s => s.occ = null); resetStats(); R.confirmReset = 0; afficherOverlay();
      message('Nouvelle partie. Bienvenue à La Chope d\'Étain.');
    } else R.confirmReset = Date.now() + 4000;
  }
  rendrePanel();
});

function ouvrirTuto() {
  if (R.overlay === 'tuto' || R.overlay === 'intro') return;
  R.retour = R.overlay; R.overlay = 'tuto'; R.page = 0;
  afficherOverlay();
}
function pageTuto(d) {
  const n = R.page + d;
  if (n < 0) return;
  if (n >= TUTO.length) { fermerTuto(); return; }
  R.page = n; afficherOverlay();
}
function fermerTuto() {
  const premiere = !S.tutoVu;
  S.tutoVu = true; sauver();
  R.overlay = R.retour; R.retour = null;
  afficherOverlay();
  if (premiere) message('Bienvenue à La Chope d\'Étain. Touche T pour relire le carnet.');
}

ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const o = b.dataset.o;
  if (o === 'commencer') { S.introVue = true; sauver(); R.overlay = null; ouvrirTuto(); }
  else if (o === 'tuto') ouvrirTuto();

const Musique = (() => {

      vib.connect(vg); vg.connect(o.frequency); o.connect(g);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.07);
      g.gain.setValueAtTime(0.2, t + d * 0.85); g.gain.linearRampToValueAtTime(0, t + d);
      o.start(t); vib.start(t); o.stop(t + d + 0.05); vib.stop(t + d + 0.05);
    } else { // corde pincée : luth pour le chant, plus grave et plus doux pour la basse
      const o = ac.createOscillator(), filtre = ac.createBiquadFilter(), basse = type === 'basse';
      o.type = basse ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      filtre.type = 'lowpass'; filtre.frequency.setValueAtTime(basse ? 900 : f * 6, t); filtre.frequency.exponentialRampToValueAtTime(basse ? 300 : f * 1.5, t + 0.4);
      o.connect(filtre); filtre.connect(g);
      const fin = t + Math.min(d + 0.3, 1.6), vol = basse ? 0.3 : 0.16;

      o.start(t); o.stop(fin);
    }
  }
  function tambour(t, fort) { // tambourin : coup sourd et peau frappée
    const o = ac.createOscillator(), g = ac.createGain();

    const b = ac.createBufferSource(), fb = ac.createBiquadFilter(), gb = ac.createGain();
    b.buffer = bruit; fb.type = 'bandpass'; fb.frequency.value = 900; fb.Q.value = 0.8;
    gb.gain.setValueAtTime(fort ? 0.12 : 0.06, t); gb.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    b.connect(fb); fb.connect(gb); gb.connect(bus); b.start(t); b.stop(t + 0.1);
  }
  function planifier() {
    const p = pistes[air], horizon = ac.currentTime + 0.3;
    p.voix.forEach((v, i) => {
      const c = curseurs[i];
      while (c.t < horizon) {
        const n = v[c.i], d = n.d * p.temps;
        if (n.f) note(i ? 'basse' : p.chant, n.f, c.t, d, bus);
        c.t += d; c.i = (c.i + 1) % v.length;
      }
    });
    while (tTambour < horizon) {
      const a = p.tambour[iTambour % p.tambour.length];
      if (a) tambour(tTambour, a === 2);
      tTambour += p.temps; iTambour++;
    }
  }
  function lancer(n) {
    if (bus) { // l'air précédent s'éteint doucement
      const vieux = bus, osc = bourdons; vieux.gain.setTargetAtTime(0, ac.currentTime, 0.4);
      setTimeout(() => { osc.forEach(o => o.stop()); vieux.disconnect(); }, 3000);
      bus = null; clearInterval(minuteur);
    }
    air = n;
    if (n < 0) return;
    const p = pistes[n], t0 = ac.currentTime + 0.5;
    bus = ac.createGain(); bus.connect(maitre);
    bus.gain.setValueAtTime(0, ac.currentTime); bus.gain.linearRampToValueAtTime(1, t0);
    const fb = ac.createBiquadFilter(), gb = ac.createGain(); // bourdon de vielle, en continu
    fb.type = 'lowpass'; fb.frequency.value = 500; gb.gain.value = 0.035; fb.connect(gb); gb.connect(bus);
    bourdons = p.bourdon.map(nb => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq(nb); o.connect(fb); o.start(); return o; });
    curseurs = p.voix.map(() => ({ i: 0, t: t0, t0 })); tTambour = t0; iTambour = 0;
    planifier(); minuteur = setInterval(planifier, 80);
  }
  function maj(voulu) { // appelée à chaque image : change d'air si besoin
    if (!ac || voulu === air) return;
    lancer(voulu);
    if (voulu < 0) setTimeout(() => { if (air < 0) ac.suspend(); }, 1500); else ac.resume();
  }
  function demarrer() { // les navigateurs n'autorisent le son qu'après un geste du joueur
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); maitre = ac.createGain(); maitre.gain.value = 0.45; maitre.connect(ac.destination);
    bruit = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate);
    const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  document.addEventListener('visibilitychange', () => { if (ac && air >= 0) document.hidden ? ac.suspend() : ac.resume(); });
  // pour le barde : le temps qui bat (en nombre de temps écoulés), ou null quand rien ne joue
  const battement = () => ac && air >= 0 && ac.state === 'running' ? (ac.currentTime - curseurs[0].t0) / pistes[air].temps : null;
  return { demarrer, maj, battement, nom: n => AIRS[n].nom };
})();
const airDuJour = () => (S.jour - 1) % AIRS.length;
function basculerMusique() {
  S.musique = S.musique === false; sauver();
  message(S.musique ? `Le ménestrel reprend : ${Musique.nom(airDuJour())}.` : 'Le ménestrel se tait.');
}
addEventListener('pointerdown', Musique.demarrer);
addEventListener('keydown', Musique.demarrer);

/* ---------- boucle ---------- */
if (!S.introVue) R.overlay = 'intro';
else if (!S.tutoVu) ouvrirTuto(); // parties commencées avant l'ajout du tutoriel
afficherOverlay();
let dernier = performance.now(), dernierRendu = 0;
function boucle(now) {
  const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
  if (!R.overlay) maj(dt);
  Musique.maj(S.musique === false ? -1 : airDuJour());
  dessiner(now / 1000);
  if (now - dernierRendu > 250) { rendrePanel(); dernierRendu = now; }
  requestAnimationFrame(boucle);
}
rendrePanel();
requestAnimationFrame(boucle);
</script>
